<script>
"use strict";
/* ============ yardımcılar ============ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,"0");
const DAY=864e5;
const toDn=iso=>{if(!iso||typeof iso!=="string")return null;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);return m?Date.UTC(+m[1],+m[2]-1,+m[3])/DAY:null};
const ymd=dn=>{const t=new Date(dn*DAY);return[t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()]};
const fromYmd=(y,m,d)=>Date.UTC(y,m,d)/DAY;
const toIso=dn=>{const[y,m,d]=ymd(dn);return y+"-"+pad(m+1)+"-"+pad(d)};
const fmt=dn=>{if(dn==null)return"";const[y,m,d]=ymd(dn);return pad(d)+"."+pad(m+1)+"."+y};
const fmtS=dn=>{const[,m,d]=ymd(dn);return pad(d)+"."+pad(m+1)};
// ay ekle/çıkar; ayın son günü taşarsa ayın son gününe çekilir (31.08 − 6 ay = 28/29.02)
const addM=(dn,n)=>{const[y,m,d]=ymd(dn);const last=new Date(Date.UTC(y,m+n+1,0)).getUTCDate();return fromYmd(y,m+n,Math.min(d,last))};
const eom=dn=>{const[y,m]=ymd(dn);return fromYmd(y,m+1,0)};
const wd=dn=>(new Date(dn*DAY).getUTCDay()+6)%7;// Pzt=0
const todayDn=()=>{const t=new Date();return fromYmd(t.getFullYear(),t.getMonth(),t.getDate())};
const DAYN=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
const MON=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const norm=s=>String(s??"").toLocaleLowerCase("tr").replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const clampInt=(v,a,b)=>Math.max(a,Math.min(b,parseInt(v,10)||a));
const EXAM=new Set(["TRE","SFE"]);
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

/* ============ veri ============ */
const LS_KEY="simplan.v1";
const DEF={start:"",end:"",lpcSec:2,opcSec:2,maxGap:1,winM:3,gapM:4,lpcM:12,opcM:6,instrPerDay:1,avoidFinal:true,avoidMix:true,pairRank:true,prio:["rank","final","mix"],visaHard:false,diffInstr:true};
// öncelikli kurallar (prio: 0 = en önemli); kurallar çakışınca üstteki korunur
const PRULES={final:"Mümkünse kişiyi son ayında planlama",mix:"Mecbur kalmadıkça LPC ve OPC aynı oturumda planlama",rank:"Mecbur kalmadıkça 1 CPT + 1 F/O eşleşmesi (iki CPT / iki F/O yok)"};
const RULEKEY={final:"avoidFinal",mix:"avoidMix",rank:"pairRank"};
const ruleOn=(S,k)=>S[RULEKEY[k]]!==false;
const prioOf=S=>{const p=(Array.isArray(S.prio)?S.prio:[]).filter((k,i,a)=>k in PRULES&&a.indexOf(k)===i);for(const k of["rank","final","mix"])if(!p.includes(k))p.push(k);return p};
const prioBox=S=>{const p=prioOf(S);return p.map((k,i)=>`<div class="row" style="gap:8px;margin:3px 0;flex-wrap:nowrap"><b style="width:18px">${i+1}.</b><label class="ck" style="flex:1"><input type="checkbox" data-pon="${k}"${ruleOn(S,k)?" checked":""}><span>${PRULES[k]}</span></label><button class="s np" data-pmv="${i}" data-dir="-1"${i?"":" disabled"} title="Önceliği artır">▲</button><button class="s np" data-pmv="${i}" data-dir="1"${i<p.length-1?"":" disabled"} title="Önceliği azalt">▼</button></div>`).join("")+
 '<div class="mu" style="margin-top:4px">1 = en önemli. Kurallar çakışınca üstteki kural korunur, alttaki gerekirse esnetilir. İşareti kaldırılan kural uygulanmaz.</div>'};
const LISTS={
 crew:{t:"Ekip",sheet:"Ekip",cols:[
  {k:"rank",l:"Rütbe",t:"sel",o:["CPT","F/O"],al:["rutbe","rank","unvan","gorev","pozisyon"]},
  {k:"name",l:"Ad Soyad",t:"text",al:["adsoyad","namesurname","adisoyadi","name","isim","personel"],w:190},
  {k:"code",l:"Kod",t:"code",al:["kod","code","codes","kisaltma"]},
  {k:"lpc",l:"LPC Geçerlilik",t:"date",al:["lpcgecerlilik","lpcexpiry","lisansgecerlilik","lpcvalid","lpc","valid","gecerlilik"],tip:"OPC geçerliliği bundan hesaplanır: LPC'den 6 ay önce ya da sonra (bugünden sonraki ilk tarih, ay sonuna yuvarlanır)."},
  {k:"last",l:"Son Sim Tarihi",t:"date",al:["sonsimtarihi","sonsimulatortarihi","sonkontroltarihi","sonkontrol","sonsim","lastsim","lastcheck","sonsimulator"],tip:"En son katıldığı kontrolün (LPC/OPC) tarihi; 4 ay kuralı buna göre uygulanır."}],
  // Excel'de bu başlıklar olsa da okunmaz (başka sütunla karışmasın diye)
  ign:["vize","visa","opc","sonsimyeri","themostrecent","lastlocation","sonyer","not","note","aciklama"]},
 visaTypes:{t:"Vize türleri",sheet:"VizeTurleri",cols:[
  {k:"name",l:"Vize türü",t:"text",al:["vizeturu","visatype","tur","type","name","ad"],w:110},
  {k:"locs",l:"Gerektiği sim lokasyonları",t:"text",al:["lokasyonlar","lokasyon","locations","location","locs"],w:170,tip:"Virgülle ayırın (ör. AMS, FRA). * = başka bir vize türünde yazmayan tüm lokasyonlar."},
  {k:"green",l:"Yeşil pasaportla gerekmez",t:"check",al:["yesilpasaportlagerekmez","yesilpasaport","muaf","green"]}]},
 visas:{t:"Kişi vizeleri",sheet:"Visa",get cols(){return[
  {k:"code",l:"CC",t:"code",al:["cc","kod","code","codes"]},
  {k:"name",l:"NameSurname",t:"text",al:["namesurname","adsoyad","name","adisoyadi","isim"],w:190},
  {k:"green",l:"Yeşil Pasaport",t:"check",al:["yesilpasaport","greenpassport","yesil","green"],tip:"İşaretliyse 'Yeşil pasaportla gerekmez' olan vize türlerine bakılmaz; diğer türler (ör. UK) yine kontrol edilir."},
  ...(DB?.visaTypes||[]).filter(t=>t.name&&t.id).map(t=>({k:"v_"+t.id,l:t.name,t:"date",al:[norm(t.name)],tip:(t.locs||"")+(t.green?" · yeşil pasaportla gerekmez":"")}))]}},
 instr:{t:"Eğitmenler",sheet:"Egitmenler",cols:[
  {k:"code",l:"Kod",t:"code",al:["kod","code"]},
  {k:"name",l:"Ad Soyad",t:"text",al:["adsoyad","name","adisoyadi","isim"],w:190},
  {k:"role",l:"Yetki",t:"sel",o:["TRE","SFE","TRI","SFI"],al:["yetki","role","rol","yetkisi","rating"],tip:"Kontrol sektörlerine (LPC/OPC) yalnızca TRE ve SFE atanır; eğitim sektörlerine (LPT/OPT) herkes."},
  {k:"note",l:"Not",t:"text",al:["not","note","aciklama"],w:130}]},
 sims:{t:"Simülatör müsaitliği",sheet:"Simulatorler",cols:[
  {k:"date",l:"Tarih",t:"date",al:["tarih","date","slottarihi","gun"]},
  {k:"dev",l:"FSTD / Uçak",t:"dev",al:["fstducak","fstd","simulator","sim","ucak","cihaz","kodtescil","kod","tescil"],tip:"FSTD / Uçak listesinden seçin"},
  {k:"slot",l:"Slot",t:"slot",al:["slot","seans","slotharfi"],tip:"Seçilen simülatörün slotu (A–F). Uçakta slot yoktur."},
  {k:"status",l:"Durum",t:"sel",o:["Tahmini","Reserved"],al:["durum","status","rezervasyon"],tip:"Reserved: rezervasyonu yapılmış slot; yeni planda önce kullanılır. Tahmini: taslak planın önerdiği slot."},
  {k:"note",l:"Not",t:"text",al:["not","note","aciklama","rezervasyonno"],w:140}],
  // yalnızca içe aktarmada okunur: eski tarih aralığı biçimi ve ayrı saat sütunu
  extra:[{k:"_from",al:["baslangic","from","start","ilk"]},{k:"_to",al:["bitis","to","end"]},{k:"_days",al:["gunler","days"]},{k:"_time",al:["saat","time","slotsaati","slotsaat"]}],
  ro:(it,c)=>it.status==="Tahmini"&&["date","dev","slot"].includes(c.k),noDel:it=>it.status==="Tahmini"&&!!slotSession(it)},
 blackouts:{t:"Kapalı günler",sheet:"KapaliGunler",cols:[
  {k:"from",l:"Başlangıç",t:"date",al:["baslangic","from","start","tarih","date"]},
  {k:"to",l:"Bitiş",t:"date",al:["bitis","to","end"]},
  {k:"note",l:"Açıklama",t:"text",al:["aciklama","note","not","neden"],w:200}]},
 leaves:{t:"Kişi izinleri",sheet:"Izinler",cols:[
  {k:"code",l:"Kod",t:"code",al:["kod","code"]},
  {k:"from",l:"Başlangıç",t:"date",al:["baslangic","from","start"]},
  {k:"to",l:"Bitiş",t:"date",al:["bitis","to","end"]},
  {k:"note",l:"Açıklama",t:"text",al:["aciklama","note","not"],w:200}]},
 nofly:{t:"Birlikte uçmayacaklar",sheet:"BirlikteUcmayacaklar",cols:[
  {k:"a",l:"Kod 1",t:"code",al:["kod1","code1","kisi1"]},
  {k:"b",l:"Kod 2",t:"code",al:["kod2","code2","kisi2"]},
  {k:"note",l:"Açıklama",t:"text",al:["aciklama","note","not","neden"],w:220}]}
};
const SHEET_ALIAS=[["visaTypes",["vizetur","visatype"]],["visas",["visa","vize"]],["crew",["ekip","crew","pilot"]],["instr",["egitmen","instructor","ogretmen","tre","tri"]],["nofly",["birlikte","eslesme","nofly","ucmayacak"]],["devices",["fstd","ucak","cihaz","device"]],["sims",["simulator","musait","sim"]],["blackouts",["kapali","tatil","holiday","blackout"]],["leaves",["izin","leave"]]];
// FSTD / Uçak: SHGM form uygulamasındaki tabloyla aynı yapı (k: FFS/AC, c: kod/tescil, ac: tip, op, mf, loc, tz, a: aktif, s: slotlar A–F)
const SLOTS=["A","B","C","D","E","F"],TZS=["Europe/Istanbul","Europe/Amsterdam","Europe/Berlin","Europe/London","Europe/Paris","Europe/Zurich","Asia/Dubai","Asia/Qatar","UTC"];
const DEV0=[
{id:0,k:"FFS",c:"EU-NL9",ac:"B744",op:"CAE",mf:"CAE",loc:"AMS",tz:"Europe/Amsterdam",a:1,s:{A:["06:30","10:30"],B:["10:45","14:45"],C:["15:00","19:00"],D:["19:15","23:15"],E:["23:30","03:30"]}},
{id:1,k:"FFS",c:"DE-1A-007",ac:"B744",op:"LFT FT16",mf:"CAE",loc:"FRA",tz:"Europe/Berlin",a:1,s:{A:["03:15","06:45"],B:["06:50","10:50"],C:["10:55","14:55"],D:["15:00","19:00"],E:["19:05","23:05"],F:["23:10","03:10"]}},
{id:2,k:"FFS",c:"DE-1A-049",ac:"B744",op:"LFT FT48",mf:"Thales",loc:"FRA",tz:"Europe/Berlin",a:1,s:{A:["03:20","06:50"],B:["06:55","10:55"],C:["11:00","15:00"],D:["15:05","19:05"],E:["19:10","23:10"],F:["23:15","03:15"]}},
{id:3,k:"FFS",c:"EU-NL10",ac:"B744",op:"FZC",mf:"CAE",loc:"SHJ",tz:"Asia/Dubai",a:1,s:{A:["08:00","12:00"],B:["12:30","16:30"],C:["17:00","21:00"],D:["21:30","01:30"],E:["02:00","06:30"]}},
{id:4,k:"AC",c:"TC-ABC",ac:"B744",op:"",mf:"",loc:"IST",tz:"Europe/Istanbul",a:1,s:{}}];
const DEVMETA={t:"FSTD / Uçak",sheet:"FSTD"};
const cloneDev=d=>({...d,s:JSON.parse(JSON.stringify(d.s||{}))});
const formDevices=()=>{try{const a=JSON.parse(ls.g("shgm_dev")||"null");return Array.isArray(a)&&a.length?a.filter(d=>d&&d.c):null}catch(e){return null}};// form uygulamasının listesi (aynı tarayıcı)
const seedDevices=()=>(formDevices()||DEV0).map(cloneDev);
const isAC=d=>!!d&&d.k==="AC";
const devById=id=>DB.devices.find(d=>id!==""&&id!=null&&String(d.id)===String(id));
const slotTime=(d,k)=>d&&!isAC(d)&&d.s?.[k]?d.s[k][0]+"–"+d.s[k][1]:"";
const devLane=(d,k)=>d.c+(isAC(d)||!k?"":" "+k);
const nextDevId=list=>Math.max(-1,...list.map(d=>+d.id).filter(n=>!isNaN(n)))+1;
const parseSlot=v=>{const m=/(\d{1,2})[:.](\d{2})\s*[-–]\s*(\d{1,2})[:.](\d{2})/.exec(String(v||""));return m?[pad(m[1])+":"+m[2],pad(m[3])+":"+m[4]]:null};
const makeLane=(dv,k)=>{const key=devLane(dv,k),t=slotTime(dv,k);return{key,sim:dv.c,slot:k,time:t,label:key+(t?" ("+t+")":isAC(dv)?" (uçak)":""),loc:(dv.loc||"").toUpperCase(),kind:dv.k,active:!!dv.a,avail:new Set(),res:new Set()}};
const rowLane=r=>{const dv=devById(r.dev);return dv?devLane(dv,isAC(dv)?"":r.slot):null};
// bir oturumun sektörleri aynı simülatörün farklı slotlarında olabilir: se.lanes[k] (yoksa se.lane)
const laneAt=(se,k)=>se.lanes?.[k]||se.lane;
const slotSession=r=>{const k=rowLane(r);return k?DB.sessions.find(se=>se.dates.some((dt,i)=>dt===r.date&&laneAt(se,i)===k))||null:null};

function initState(c,X){const S=X.S,lpc=toDn(c.lpc),a=eom(addM(lpc,-S.opcM));

function nextEvent(st,X){const S=X.S;let type,deadline,early=false;

// aylık hedef oturum: dönemdeki kontrol sayısı / 2 / ay sayısı (kontroller son aydan hemen önce yapılmış sayılır)
const mKey=dn=>{const[y,m]=ymd(dn);return y*12+m};
function monthTarget(X){const S=X.S;let n=0;
 for(const c of X.crew){let st=initState(c,X);for(let g=0;g<8;g++){const ev=nextEvent(st,X),d=Math.max(ev.earliest+1,X.start,Math.min(ev.soft,ev.deadline));if(d>X.end)break;n++;st=applyCheck(st,ev,d,S)}}

// seçilen simülatörler için her ay tek blok: ihtiyaç (hedef + ek − o ayki Reserved oturum) × sektör / simülatör sayısı kadar ardışık gün;
// kapalı günlere girmez, mümkünse ayın ilk ve son 5 gününe girmez, ortaya yakın konur. Sonuç: hat anahtarı → gün kümesi
function monthBlocks(X,prefLanes,extra){const out=new Map(prefLanes.map(L=>[L.key,new Set()]));if(!prefLanes.length)return out;
 const T=monthTarget(X),n=Math.max(X.sec.LPC,X.sec.OPC);
 for(let k=mKey(X.start);k<=mKey(X.end);k++){const y=Math.floor(k/12),m=k%12,first=fromYmd(y,m,1),last=fromYmd(y,m+1,0),lo=Math.max(first,X.start),hi=Math.min(last,X.end);if(hi<lo)continue;
  let resDays=0;X.laneArr.forEach(L=>L.res.forEach(d=>{if(d>=lo&&d<=hi)resDays++}));
  const need=Math.max(0,T+(extra.get(k)||0)-Math.floor(resDays/n));if(!need)continue;
  const len=Math.min(hi-lo+1,Math.ceil(need/prefLanes.length)*n),mid=(fromYmd(y,m,6)+fromYmd(y,m+1,-5))/2;let best=null,bs=Infinity;
  for(let a=lo;a+len-1<=hi;a++){let bad=0,edge=0;let taken=0;for(let d=a;d<a+len;d++){if(X.black.has(d))bad++;if(prefLanes.some(L=>X.slotRow.has(L.key+"|"+d)))taken++;const dd=ymd(d)[2],dl=ymd(last)[2];if(dd<=5||dd>dl-5)edge++}
   const sc=bad*1000+taken*500+edge*10+Math.abs(a+(len-1)/2-mid);if(sc<bs){bs=sc;best=a}}
  if(best==null)continue;for(let d=best;d<best+len;d++)if(!X.black.has(d))out.forEach(set=>set.add(d))}
 return out}

 const lanes=X.laneArr.filter(L=>L.active).map(L=>({...L,tent:new Set()})),lmap=new Map(lanes.map(L=>[L.key,L]));
 tent.forEach((days,key)=>{let L=lmap.get(key);if(!L){const[dv,k]=X.prefLanes?.find(p=>p.key===key)?.dk||[];if(!dv)return;L={...makeLane(dv,k),tent:new Set()};lanes.push(L);lmap.set(key,L)}days.forEach(d=>{if(!L.avail.has(d)&&!X.slotRow.has(key+"|"+d))L.tent.add(d)})});

 const st=new Map(),pend=new Map();X.crew.forEach(c=>st.set(c.code,initState(c,X)));

 const nextLock=c=>{const L=lockByPilot.get(c.code);return L?L[lockPtr.get(c.code)||0]||null:null};

 const N=X.end-X.start+1;
 const pref=lanes.map(L=>{const a=new Int32Array(N+1),b=laneBusy.get(L.key);for(let i=0;i<N;i++){const d=X.start+i;a[i+1]=a[i]+(use(L,d)&&!b.has(d)?1:0)}return a});
 const cap=(from,to,n)=>{const i0=Math.max(0,from-X.start),i1=Math.min(N,to-X.start+1);if(i1<=i0)return 0;let s=0;for(const a of pref)s+=Math.floor((a[i1]-a[i0])/n);return s};
 // boş Reserved günlerin kapasitesi (hep önce bunlar kullanılır)
 const prefR=lanes.map(L=>{const a=new Int32Array(N+1);for(let i=0;i<N;i++){const d=X.start+i;a[i+1]=a[i]+(L.res.has(d)?1:0)}return{L,a}});
 // aynı simülatörün slotları birlikte sayılır (sektörler farklı slotlarda olabilir)
 const sims=new Map();lanes.forEach(L=>{if(!sims.has(L.sim))sims.set(L.sim,[]);sims.get(L.sim).push(L)});
 const capR=(from,to,n)=>{const i0=Math.max(0,from-X.start),i1=Math.min(N,to-X.start+1);if(i1<=i0)return 0;let s=0;
  for(const ls of sims.values()){const free=d=>ls.filter(L=>L.res.has(d)&&!laneBusy.get(L.key).has(d)).length;let run=0,c=0;for(let i=i0;i<i1;i++){const d=X.start+i;if(free(d)){if(++run===n){c++;run=0}}else run=0}s+=c}return s};
 // tahmini güne ancak kişinin son ayına kadar boş Reserved günler herkese yetmiyorsa konur
 const allowTent=(a,d,n)=>{const W=a.soft<0?a.latest:a.ev.soft;let dem=0;for(const q of X.crew){const e=getPend(q);if(e&&X.sec[e.type]===n&&Math.min(e.soft,e.expired?X.end:e.deadline)<=W&&e.earliest<W)dem++}return capR(d+1,W,n)*2<dem};
 // blok: ilk sektör L hattında; sonraki sektörler aynı simülatörün herhangi bir slotunda olabilir (önce Reserved, sonra aynı slot)
 const block=(L,d,n)=>{const r=[d],ls=[L];let cur=d,last=L;for(let k=1;k<n;k++){let nx=null,nl=null;
   for(let g=1;g<=S.maxGap&&nx==null;g++){const x=cur+g;if(x>X.end)break;
    const opts=(sims.get(L.sim)||[L]).filter(M=>use(M,x)&&!laneBusy.get(M.key).has(x)).sort((a,b)=>((b.res.has(x)?2:0)+(b===last?1:0))-((a.res.has(x)?2:0)+(a===last?1:0)));
    if(opts.length){nx=x;nl=opts[0]}}
   if(nx==null)return null;r.push(nx);ls.push(nl);cur=nx;last=nl}
  r.lanes=ls;return r};
 const assign=(L,dates,pil)=>{const n=dates.length;if(!X.instr.length)return dates.map(()=>"");const res=[];
  for(let k=0;k<n;k++){const d=dates[k],chk=isCheckSector(k,n);let best=null,bs=Infinity;
   for(const t of X.instr){const o=day.get(t.code)?.get(d);if(o&&(o.st||o.te>=S.instrPerDay))continue;if(onLeave(X,t.code,d))continue;if(chk&&!EXAM.has(t.role))continue;
    if(pil.some(p=>p.code===t.code||noFly(X,p.code,t.code)))continue;
    const vx=visaExpired(visaOf(X,t.code,L.loc),d);if(vx&&S.visaHard)continue;
    let sc=(load.get(t.code)||0)*.01+(vx?20:0);if(!chk&&EXAM.has(t.role))sc+=3;if(chk&&S.diffInstr&&n>1&&res[0]===t.code)sc+=5;if(!chk&&k>0&&res[k-1]===t.code)sc-=1;
    if(sc<bs){bs=sc;best=t}}
   if(!best)return null;res.push(best.code)}return res};
 const cands=(L,dates)=>{const c=dates.at(-1),n=dates.length,out=[];
  for(const p of X.crew){const ev=getPend(p);if(!ev||X.sec[ev.type]!==n)continue;const latest=ev.expired?X.end:ev.deadline;if(c<=ev.earliest||c>latest)continue;
   const nl=nextLock(p);if(nl){if(reserved(p,ev))continue;if(c>addM(nl.check,-S.gapM))continue}
   if(dates.some(x=>{const o=day.get(p.code)?.get(x);return(o&&(o.st||o.te))||onLeave(X,p.code,x)}))continue;
   if(S.visaHard&&visaExpired(visaOf(X,p.code,L.loc),c))continue;
   out.push({p,ev,c,latest,soft:ev.soft-c,hard:latest-c})}
  return out.sort((a,b)=>a.soft-b.soft||a.hard-b.hard||X.order.get(a.p.code)-X.order.get(b.p.code))};
 // eşleşme kurallarının cezası: açık kurallar öncelik sırasına göre 2'nin kuvvetleri (üstteki kural daha ağır)
 const PR=prioOf(S),WT={};{const on=PR.filter(k=>k!=="final"&&ruleOn(S,k));on.forEach((k,i)=>WT[k]=2**(on.length-1-i))}
 const above=k=>ruleOn(S,"final")&&PR.indexOf(k)<PR.indexOf("final");
 const penalty=(a,b,ta,tb)=>(ta!==tb?(WT.mix||0):0)+(a.rank===b.rank?(WT.rank||0):0);
 const freeIn=(code,from,to)=>{for(let x=from;x<=to;x++)if(!onLeave(X,code,x))return true;return false};
 // "mecbur kalmak": ideal olmayan eşi (ceza pen) kabul etmeden önce: süre penceresi içinde daha iyi eş çıkabilecek mi, kapasite yetiyor mu?
 // Pencere: rütbe uyumsuzluğunda (pen>=2, ayar açıksa) geçerlilik bitişi, diğerlerinde son aydan önceki gün.
 // ihlal edilen kural "son ay" kuralından önemliyse daha iyi eş için geçerlilik bitişine kadar beklenir, değilse son aydan önceye kadar
 // rb: karar verilen blok Reserved ise daha iyi eş ancak ileride boş Reserved günde aranır (tahmini bloğa kaçılmaz)
 const acceptPen=(a,d,n,pen,rb)=>{const C=rb?capR:cap,vM=!!(pen&(WT.mix||0)),vR=!!(pen&(WT.rank||0)),W=(vR&&above("rank"))||(vM&&above("mix"))?a.latest:a.ev.expired?X.end:a.ev.soft;if(W<a.c)return true;let dem=0;
  for(const q of X.crew){const e=getPend(q);if(e&&X.sec[e.type]===n&&Math.min(e.soft,e.expired?X.end:e.deadline)<=W&&e.earliest<=W)dem++}
  if((C(d,W,n)-1)*2<dem)return true;
  // daha iyi eş adayları (better) ile aynı adaylara ihtiyaç duyan, süresi pencere içinde biten rakipler (riv) karşılaştırılır
  let better=0,riv=0;
  for(const q of X.crew){if(q===a.p)continue;const e=getPend(q);if(!e||X.sec[e.type]!==n||reserved(q,e))continue;const ql=e.expired?X.end:e.deadline;
   if((!WT.rank||q.rank===a.p.rank)&&(vR||e.type===a.ev.type)&&e.earliest<=W&&ql<=W)riv++;
   if(noFly(X,q.code,a.p.code))continue;const pq=penalty(a.p,q,a.ev.type,e.type);if(pq==null||pq>=pen)continue;
   const from=Math.max(d+1,e.earliest+1-(n-1)*S.maxGap),to=Math.min(W,ql);if(from>to)continue;
   if(freeIn(q.code,from,to)&&freeIn(a.p.code,from,to)&&C(from,to,n)>0)better++}
  return better<=riv};
 const pick=(L,d,dates,cs)=>{const n=dates.length,tb=dates.some((x,i)=>!dates.lanes[i].res.has(x));
  for(let i=0;i<cs.length;i++){const a=cs[i],parts=[];if(tb&&!allowTent(a,d,n))continue;
   for(let j=0;j<cs.length;j++){if(i===j)continue;const b=cs[j];if(noFly(X,a.p.code,b.p.code))continue;const pen=penalty(a.p,b.p,a.ev.type,b.ev.type);if(pen!=null)parts.push({b,pen,j})}
   parts.sort((x,y)=>x.pen-y.pen||x.j-y.j);const ok=new Map();
   for(const q of parts){if(q.pen>0){if(!ok.has(q.pen))ok.set(q.pen,acceptPen(a,d,n,q.pen,!tb));if(!ok.get(q.pen))continue}const ins=assign(L,dates,[a.p,q.b.p]);if(ins)return{a,b:q.b,ins,dates,L,pen:q.pen}}
   if(cap(d,a.latest,n)-1<=0){const ins=assign(L,dates,[a.p]);if(ins)return{a,b:null,ins,dates,L,pen:9}}}
  return null};
 const commit=dec=>{const{a,b,ins,dates,L}=dec;dates.forEach((x,k)=>{laneBusy.get(dates.lanes[k].key).add(x);P(a.p.code,x).st=1;if(b)P(b.p.code,x).st=1;if(ins[k]){P(ins[k],x).te++;addLoad(ins[k])}});
  const pl=[a.p,b?.p].filter(Boolean).sort((x,y)=>(x.rank==="CPT"?0:1)-(y.rank==="CPT"?0:1));
  const lk=dates.lanes.map(M=>M.key);out.push({id:uid(),lane:lk[0],...(lk.some(k=>k!==lk[0])?{lanes:lk}:{}),dates:dates.map(toIso),pilots:[pl[0].code,pl[1]?.code||""],instr:ins,locked:false});
  apply(a.p,dates.at(-1));if(b)apply(b.p,dates.at(-1))};
 const lockedQ=[...lockedS].sort((a,b)=>a.dn[0]-b.dn[0]);let li=0;
 const secs=[...new Set([X.sec.LPC,X.sec.OPC])];
 for(let d=X.start;d<=X.end;d++){
  while(li<lockedQ.length&&lockedQ[li].dn[0]<=d){const o=lockedQ[li++];o.s.pilots.forEach(code=>{const c=X.crewMap.get(code);if(!c)return;apply(c,o.dn.at(-1));lockPtr.set(code,(lockPtr.get(code)||0)+1)})}
  const order=lanes.filter(L=>use(L,d)).sort((x,y)=>(y.res.has(d)?1:0)-(x.res.has(d)?1:0));// o gün Reserved slotu olan simülatör önce
  for(const L of order){if(laneBusy.get(L.key).has(d))continue;let best=null;
   for(const n of secs){const dates=block(L,d,n);if(!dates)continue;const cs=cands(L,dates);if(!cs.length)continue;const dec=pick(L,d,dates,cs);
    if(dec&&(!best||dec.a.soft<best.a.soft||(dec.a.soft===best.a.soft&&dec.pen<best.pen)))best=dec}
   if(best)commit(best)}}
 return out}

function evaluate(X){const S=X.S;
 const ses=DB.sessions.map(s=>{const dn=s.dates.map(toDn);return{s,dn,chk:Math.max(...dn),L:X.lanes.get(s.lane),err:[],warn:[],types:{},labels:{}}}).filter(o=>o.dn.length&&o.dn.every(v=>v!=null));

  o.dn.forEach((d,k)=>{const Lk=X.lanes.get(laneAt(o.s,k));if(!Lk){o.err.push("Simülatör tanımlı değil: "+laneAt(o.s,k));return}if(!Lk.active){o.err.push(Lk.key+" pasif (FSTD / Uçak)");return}if(Lk.sim!==o.L?.sim)o.warn.push("Sektörler farklı simülatörlerde");if(!Lk.avail.has(d))o.err.push(fmt(d)+(X.black.has(d)?" kapalı gün ("+X.black.get(d)+")":" müsaitlik satırı yok"))});
  o.dn.forEach((d,k)=>{if(laneDay.get(laneAt(o.s,k)+"|"+d).length>1)o.err.push(fmt(d)+" aynı simülatör/slotta başka oturum var")});
  for(let i=1;i<n;i++)if(o.dn[i]-o.dn[i-1]>S.maxGap||o.dn[i]<=o.dn[i-1])o.warn.push("Sektör tarihleri ardışık değil");
  if(!pil.length)o.err.push("Öğrenci yok");else if(pil.length<2)o.warn.push("Tek öğrenci – koltuk doldurucu gerekli");
  if(pil.length===2&&pil[0]===pil[1])o.err.push("Aynı kişi iki kez yazılmış");
  pil.forEach(c=>{if(!X.crewMap.has(c))o.err.push(c+" ekip listesinde yok")});
  const kn=pil.map(c=>X.crewMap.get(c)).filter(Boolean);if(ruleOn(S,"rank")&&kn.length===2&&kn[0].rank===kn[1].rank)o.warn.push("Aynı rütbe (2 "+kn[0].rank+")");

  for(let i=0;i<people.length;i++)for(let j=i+1;j<people.length;j++)if(noFly(X,people[i],people[j]))o.err.push(people[i]+" ve "+people[j]+" birlikte planlanmamalı");
  o.dn.forEach((d,k)=>{[...pil,o.s.instr?.[k]].filter(Boolean).forEach(c=>{const l=onLeave(X,c,d);if(l)o.err.push(c+" "+fmt(d)+" izinli ("+l+")")})});
  if(X.instr.length){o.dn.forEach((d,k)=>{const t=o.s.instr?.[k];if(!t){o.err.push(fmt(d)+" eğitmen atanmadı");return}const T=X.instrMap.get(t);
   if(!T)o.warn.push(t+" eğitmen listesinde yok");else if(isCheckSector(k,n)&&!EXAM.has(T.role))o.err.push(fmt(d)+" kontrol sektörü için TRE/SFE gerekli ("+t+" "+T.role+")");
   if(pil.includes(t))o.err.push(t+" aynı oturumda hem öğrenci hem eğitmen")})}

   last.forEach((d,t)=>{const v=visaOf(X,t,o.L.loc);if(v.none)return;if(v.raw==null)o.warn.push(t+" (eğitmen) vize kaydı yok");else if(visaExpired(v,d))o.err.push(t+" (eğitmen) "+v.t.name+" vizesi geçersiz")})}

 const rows=[];
 for(const c of X.crew){const mine=ses.filter(o=>o.s.pilots.includes(c.code)).sort((a,b)=>a.chk-b.chk);let st=initState(c,X),prevPlanned=false;
  for(const o of mine){const ev=nextEvent(st,X),n=o.dn.length,r={c,ev,o,chk:o.chk,last:st.last,lastPlanned:prevPlanned,err:[],warn:[]};
   o.types[c.code]=ev.type;o.labels[c.code]=sectorLabels(ev.type,n);

 if(type==="sec")return`<label class="f"><span>${l}</span><select data-s="${k}">${[1,2,3,4,5].map(n=>`<option${n==v?" selected":""}>${n}</option>`).join("")}</select>${extra}</label>`;
 return`<label class="f"><span>${l}</span><input type="${type}" data-s="${k}" value="${esc(v)}"${type==="number"?' min="0" max="36"':""}>${extra}</label>`}
function vSettings(){const S=DB.settings;
 return`<div class="cd"><h2>Plan dönemi ve sektör sayıları</h2><div class="g">${fld("start","Plan başlangıcı","date")}${fld("end","Plan bitişi","date")}
 ${fld("lpcSec","LPC kaç sektör?","sec",`<span class="mu">${sectorLabels("LPC",S.lpcSec).join(" → ")}</span>`)}${fld("opcSec","OPC kaç sektör?","sec",`<span class="mu">${sectorLabels("OPC",S.opcSec).join(" → ")}</span>`)}</div></div>
 <div class="cd"><h2>Kurallar</h2><div class="g">${fld("winM","Son … ay kuralı (ay)","number")}${fld("gapM","İki kontrol arası en az (ay)","number")}${fld("lpcM","LPC geçerlilik süresi (ay)","number")}${fld("opcM","OPC geçerlilik süresi (ay, ay sonuna yuvarlanır)","number")}
 ${fld("maxGap","Sektörler arası en fazla gün farkı","number",'<span class="mu">1 = art arda günler</span>')}${fld("instrPerDay","Eğitmen günde en fazla oturum","number")}</div>
 <h3>Öncelikli kurallar</h3><div id="prioS">${prioBox(S)}</div>
 <div class="g" style="margin-top:10px"> ${fld("diffInstr","Kontrolü, eğitimi verenden farklı eğitmen yapsın (mümkünse)","check")}${fld("visaHard","Vizesi geçersiz pilot ya da eğitmeni vize gereken simülatöre hiç planlama","check")}</div></div>
 <div class="cd"><h2>Planlama nasıl yapılır</h2><ul class="rules">
 <li><b>Son ${S.winM} ay kuralı:</b> kontrol geçerliliğin son ${S.winM} ayında yapılırsa yeni geçerlilik eski bitiş tarihinden sayılır (LPC +${S.lpcM} ay). Bu yüzden en erken tarih = geçerlilik − ${S.winM} ay.</li>
 <li><b>${S.gapM} ay kuralı:</b> yılda iki kontrol; art arda iki kontrol ${S.gapM} aydan yakın olamaz. En erken tarih = son kontrol + ${S.gapM} ay (tabloda kırmızı kalın ise bu kural belirleyicidir).</li>
 <li><b>OPC:</b> LPC'den ${S.opcM} ay önce ya da sonra (bugünden sonraki ilk tarih). LPC'ler turuncu, OPC'ler sarı gösterilir. LPC aynı zamanda OPC yerine geçer.</li>
 <li>Her oturumda en az 2 öğrenci + 1 eğitmen. Süresi en yakın olan önce yerleştirilir.</li>
 <li><b>Reserved günler her zaman önce:</b> müsaitlik listesinde boş Reserved gün varsa planlayıcı tahmini güne geçmeden onu doldurur; bu, öncelikli kurallardan (son ay dahil) de önce gelir. Tahmini bloklar ancak Reserved günler yetmediğinde kullanılır. Bir oturumun sektörleri aynı simülatörün farklı slotlarında olabilir.</li>
 <li>Son sim tarihi sıradaki OPC'nin son ${S.winM} ay penceresine düşüyorsa o OPC yapılmış sayılır.</li>
 <li>Öncelikli kurallar (şu anki sıra): ${prioOf(S).map((k,i)=>`<b>${i+1}.</b> ${PRULES[k]}${ruleOn(S,k)?"":" <i>(uygulanmıyor)</i>"}`).join(" · ")}. Son ay = geçerliliğin bittiği takvim ayı (Excel'de "Final!"). LPC ile OPC ancak sektör sayıları eşitse aynı oturumda olabilir.</li>
 <li>Excel'deki gibi plan tarihi <b>Earliest Auto'dan sonra</b> (eşit olamaz) ve <b>Valid'e kadar</b> olmalı; değilse ya da planlanmamışsa "Hata".</li>
 <li>Kontrol tarihi = son sektörün tarihi. Kilitli ve slotları Reserved olan oturumlar yeniden planlamada korunur; diğerleri (Tahmini slottaki kilitliler dahil) silinip yeniden dağıtılır.</li></ul></div>`}

  case"slot":{const dv=devById(DB[key][i]?.dev);if(!dv)return'<span class="mu">önce FSTD seçin</span>';if(isAC(dv))return'<span class="mu">— (uçak)</span>';const ks=SLOTS.filter(k=>dv.s?.[k]);
   return`<select ${a}>${ks.map(k=>`<option value="${k}"${k===v?" selected":""} title="${esc(slotTime(dv,k))}">${k}</option>`).join("")}${v&&!ks.includes(v)?`<option value="${esc(v)}" selected>${esc(v)} (tanımsız)</option>`:""}</select>`}

  case"date":return`<input type="date" ${a} value="${esc(v||"")}">`;

  case"days":{const dv=Array.isArray(v)?v:Array(7).fill(true);return`<span class="days">${DAYN.map((n,j)=>`<label title="${n}"><input type="checkbox" ${a} data-j="${j}"${dv[j]!==false?" checked":""}>${n.slice(0,2)}</label>`).join("")}</span>`}
  case"code":return`<input ${a} class="code" maxlength="6" list="codes" value="${esc(v||"")}">`;
  default:return`<input ${a} value="${esc(v||"")}" style="width:${col.w||120}px">`}}
const cellText=(c,v)=>c.t==="dev"?(devById(v)?.c||""):c.t==="date"?(v?fmt(toDn(v)):""):c.t==="check"?(v?"✓ evet":"hayır"):c.t==="days"?daysStr(v):String(v??"");
const cellSort=(c,v)=>c.t==="dev"?(devById(v)?.c||""):c.t==="date"?toDn(v)??"":c.t==="check"?(v?0:1):c.t==="days"?daysStr(v):String(v??"").trim();

function crewDerived(){const X=ctx(),seen=new Map();DB.crew.forEach((c,i)=>{const k=(c.code||"").toUpperCase();if(k)seen.set(k,(seen.get(k)||0)+1)});
 DB.crew.forEach((c,i)=>{const td=$(`[data-nx="${i}"]`);const inp=$(`input[data-l="crew"][data-i="${i}"][data-k="code"]`);if(inp)inp.classList.toggle("dup",!c.code||seen.get(c.code.toUpperCase())>1);

function devErr(x){const b=[],ac=isAC(x),o=DB.devices.filter(d=>String(d.id)!==String(x.id));
 if(!x.c)b.push(ac?"Tescil gerekli":"FSTD kodu gerekli");else if(!(ac?/^[A-Z0-9]{1,2}-?[A-Z0-9]{2,5}$/:/^[A-Z0-9][A-Z0-9-]{1,19}$/).test(x.c))b.push(ac?"Tescil biçimi geçersiz (ör. TC-ABC)":"FSTD kodu yalnızca harf, rakam ve tire içerebilir (ör. DE-1A-049)");
 else if(o.some(d=>d.c===x.c))b.push(x.c+" zaten kayıtlı");
 if(!x.ac)b.push("Hava aracı tipi gerekli (ör. B744)");
 if(x.loc&&!/^[A-Z]{3}$/.test(x.loc))b.push("Lokasyon 3 harfli IATA kodu olmalı (ör. FRA)");
 if(!ac){if(!x.loc)b.push("Simülatörün lokasyonu gerekli");if(!x.tz)b.push("Saat dilimi gerekli (slot saatleri yerel)");
  const S2=SLOTS.filter(k=>x.s[k]&&(x.s[k][0]||x.s[k][1]));if(!S2.length)b.push("En az bir slot girilmeli");

 return b}

 if(d.add){UI.lf[d.add]={s:null,d:1,f:{}};const L=LISTS[d.add],it={id:uid()};L.cols.forEach(c=>it[c.k]=c.t==="days"?Array(7).fill(true):c.t==="check"?false:"");if(d.add==="sims"){const p=DB.sims.at(-1);Object.assign(it,{dev:p?.dev??"",slot:p?.slot||"",status:"Reserved"})}DB[d.add].push(it);touch();render();return}
 if(d.del){DB[d.del].splice(+d.i,1);touch();render();return}
 if(d.clear)return confirmDlg("Tümünü sil",`<b>${LISTS[d.clear].t}</b> listesindeki ${DB[d.clear].length} satır silinecek.`,"Sil",()=>{DB[d.clear]=[];touch();render()},"d");
 if(d.paste)return pasteDlg(d.paste);
 if(d.ses)return sessionDlg(d.ses);
 if(d.new){const[l,dt]=d.new.split("|");return sessionDlg(null,{lane:l,date:dt})}
 if(d.newFor!==undefined){const X=ctx(),c=X.crewMap.get(d.newFor),R=evaluate(X),r=R.rows.find(r=>r.c.code===d.newFor&&!r.o);const dt=r?Math.max(r.ev.earliest,X.start):X.start;
  let lane=X.laneArr[0]?.key,date=dt;for(const L of X.laneArr){const f=[...L.avail].filter(x=>x>=dt).sort((a,b)=>a-b)[0];if(f!=null&&(date===dt||f<date)){date=f;lane=L.key}}
  return sessionDlg(null,{pilot:c?.code,type:r?.ev.type,lane,date:toIso(date)})}
 if(d.newses)return sessionDlg(null,{});
 if(d.pmv!==undefined){const S=DB.settings,p=prioOf(S),i=+d.pmv,j=i+ +d.dir;if(j<0||j>=p.length)return;[p[i],p[j]]=[p[j],p[i]];S.prio=p;touch();render();return}
 if(d.fillvisa){const have=new Set(DB.visas.map(v=>(v.code||"").toUpperCase()));let n=0;DB.crew.forEach(c=>{if(c.code&&!have.has(c.code.toUpperCase())){DB.visas.push({id:uid(),code:c.code.toUpperCase(),name:c.name||"",green:false});n++}});touch();render();toast(n+" kişi eklendi");return}
 if(d.lockall!==undefined){DB.sessions.forEach(s=>s.locked=d.lockall==="1");save();render();toast(d.lockall==="1"?"Tüm oturumlar kilitlendi":"Kilitler kaldırıldı");return}
});
document.addEventListener("change",e=>{const el=e.target,d=el.dataset;
 if(d.l){const it=DB[d.l][+d.i],col=LISTS[d.l].cols.find(c=>c.k===d.k);if(!it||!col)return;
  if(col.t==="dev"){const dv=devById(el.value);it.dev=dv?dv.id:"";if(dv&&!isAC(dv)&&!dv.s?.[it.slot])it.slot=SLOTS.find(k=>dv.s[k])||"";if(isAC(dv))it.slot="";touch();render();return}
  if(col.t==="days"){if(!Array.isArray(it.days))it.days=Array(7).fill(true);it.days[+d.j]=el.checked}else if(col.t==="check")it[d.k]=el.checked;else if(col.t==="code"){it[d.k]=el.value.trim().toUpperCase();el.value=it[d.k]}else it[d.k]=el.value;
  touch();if(d.l==="crew")crewDerived();if(d.l==="visaTypes"||d.l==="sims")render();return}
 if(d.pon){DB.settings[RULEKEY[d.pon]]=el.checked;touch();render();return}
 if(d.s){const S=DB.settings;S[d.s]=el.type==="checkbox"?el.checked:el.type==="number"?Math.max(0,+el.value||0):el.value;if(d.s==="winM"||d.s==="gapM"||d.s==="lpcM"||d.s==="opcM"||d.s==="maxGap"||d.s==="instrPerDay")S[d.s]=Math.max(1,S[d.s]);touch();render();return}
 if(d.ui){UI[d.ui]=el.type==="checkbox"?el.checked:el.value;render()}});
// arama ve sütun filtreleri: yazmayı bekleyip yeniden çizer, imleci aynı kutuya geri koyar
document.addEventListener("input",e=>{const el=e.target,d=el.dataset;let sel=null;
 if(d.ui==="q"){UI.q=el.value;sel='[data-ui="q"]'}
 else if(d.lf){lfOf(d.lf).f[d.fk]=el.value;sel=`[data-lf="${d.lf}"][data-fk="${d.fk}"]`}
 else if(d.tf!==undefined){UI.tf[d.tf]=el.value;sel=`[data-tf="${d.tf}"]`}
 else if(d.dvf){UI.dev.f[d.dvf]=el.value;sel=`[data-dvf="${d.dvf}"]`}
 if(!sel)return;clearTimeout(window._q);window._q=setTimeout(()=>{const sc=$(".sc")?.scrollLeft||0;render();const i=$(sel);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}const s2=$(".sc");if(s2)s2.scrollLeft=sc},250)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#ov").hidden)closeDlg()});
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeDlg()});
$("#bPlan").onclick=planDlg;$("#bImp").onclick=()=>$("#fImp").click();$("#fImp").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)importFile(f)};
$("#bTpl").onclick=()=>download(xlsxBlob(inputSheets()),"simulator-plan-veri.xlsx");$("#bExp").onclick=exportPlan;$("#bPrint").onclick=()=>window.print();
$("#bMore").onclick=()=>dlg("Diğer işlemler",`<div class="row"><button id="mB">Yedek al (JSON)</button><button id="mR">Yedekten yükle</button><button id="mS">Örnek veriyi yükle</button><button id="mC" class="d">Tüm verileri temizle</button></div><div class="mu" style="margin-top:8px">Yedek dosyası tüm girdileri, ayarları ve planı içerir; başka cihaza taşımak için kullanın.</div>`,[{l:"Kapat"}],()=>{
 $("#mB").onclick=()=>{download(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}),"simulator-plan-yedek-"+toIso(todayDn())+".json");closeDlg()};
 $("#mR").onclick=()=>{closeDlg();$("#fImp").click()};
 $("#mS").onclick=()=>confirmDlg("Örnek veri","Mevcut veriler örnek veriyle değiştirilecek.","Yükle",()=>{DB=sampleDB();save();tabCounts();render()});
 $("#mC").onclick=()=>confirmDlg("Tüm verileri temizle","Ekip, eğitmen, simülatör, kısıt ve plan verilerinin tamamı silinecek.","Temizle",()=>{DB=emptyDB();save();tabCounts();render()},"d")});
load();tabCounts();render();
</script></body></html>
